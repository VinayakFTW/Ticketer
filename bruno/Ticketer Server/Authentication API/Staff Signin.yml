info:
  name: Staff Signin
  type: http
  seq: 3
  tags:
    - Authentication API

http:
  method: POST
  url: "{{baseUrl}}/auth/signin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "staff@sitpune.edu.in",
        "password": "StaffPassword@123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.access_token) {
            bru.setVar("staff_token", res.body.data.access_token);
        }
    - type: tests
      code: |-
        test("Status code is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Staff access token dynamically extracted", function() {
          expect(res.body.data).to.be.an('object');
          expect(res.body.data.access_token).to.be.a('string');
          expect(res.body.data.token_type).to.equal('bearer');
        });

        test("Login success message received", function() {
          expect(res.body.message).to.equal('Login successful');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.message
      operator: eq
      value: "Login successful"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
